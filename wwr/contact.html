<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Wild River Adventures for questions, reservations, or feedback. Find our address, phone number, email, and an easy-to-use contact form.">
    <meta name="author" content="Leticia Moura">
    <title>Contact Us - Wild River Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Wild River Adventures Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Wild River Adventures</h1>

        <section class="contact-info">
            <h2>Get In Touch</h2>
            <address>
                123 Main River Street<br>
                Kolob, CA 99999<br>
                Phone: <a href="tel:+19999999999">+1 999 999 9999</a><br>
                Email: <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3021.9!2d-111.7!3d37.4!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDI0JzAwLjAiTiAxMTHCsDQyJzAwLjAiVw!5e0!3m2!1sen!2sus!4v0000000000000"
                  width="400" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade" title="Map to Wild River Adventures">
                </iframe>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <fieldset class="message-purpose">
                    <legend>Message Purpose</legend>

                    <input type="radio" id="general" name="purpose" value="general" checked>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Type here"
                  required></textarea>

                <div class="subscribe">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpeg" alt="Photo of Head Guide">
                    <figcaption>Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpeg" alt="Photo of Reservations Manager">
                    <figcaption>Reservations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpeg" alt="Photo of Safety Coordinator">
                    <figcaption>Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Wild River Adventures | Leticia Moura</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
